# gloabl vars
ci_cd_namespace: &ci_cd "labs-ci-cd"
dev_namespace: &dev "labs-dev"
test_namespace: &test "labs-test"
staging_namespace: &stage "labs-staging"

# App of applications list
applications:
  # Bootstrap Project — creates team namespaces with RBAC and optional OperatorGroups.
  # Using our helm-catalog/bootstrap-project chart instead of the community redhat-cop version.
  # Key addition: every namespace is auto-labelled argocd.argoproj.io/managed-by: my-team-gitops
  # so the team ArgoCD SA gains deploy rights without any platform team involvement.
  #
  # Namespace naming convention (derived automatically):
  #   my-team-tools                  — CI/CD tooling (always created)
  #   my-team-<system>-<env>         — one per system × env combination
  - name: bootstrap
    enabled: true
    # destination is overridden to my-team-gitops (the team ArgoCD's own namespace) so
    # the team ArgoCD can reconcile this Application before my-team-ci-cd exists.
    # bootstrap-project creates Namespace objects (cluster-scoped) — the destination
    # namespace is just a landing spot for any non-namespaced resources, not where
    # namespaces themselves are created. Removing this override would cause a
    # chicken-and-egg: the namespace bootstrap creates is the one it would need to deploy into.
    destination: my-team-gitops
    source: https://github.com/nu-j/helm-catalog.git
    source_path: bootstrap-project
    source_ref: main
    values:
      team: my-team
      bindings:
        - name: my-team-devs
          kind: Group
          role: edit
        - name: my-team-admins
          kind: Group
          role: admin
      systems:
        - name: pet-battle
          envs: [dev, test, stage]
          operatorgroup: true

   # Hoverfly
  - name: hoverfly
    enabled: true
    source: https://github.com/helm/charts.git
    source_path: incubator/hoverfly
    source_ref: "master"
    values:
      image:
        tag: v1.3.3
      openshift:
        route:
          admin:
            enabled: true
            hostname: ''
          proxy:
            enabled: true
            hostname: ''

# Tekton Pipelines
  - name: tekton-pipeline
    enabled: true
    source: https://github.com/rht-labs/tech-exercise.git
    source_ref: main
    source_path: tekton
    values:
      team: my-team

