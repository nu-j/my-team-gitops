# gloabl vars
ci_cd_namespace: &ci_cd "labs-ci-cd"
pm_namespace: &pm "labs-pm"
ops_namespace: &ops "labs-cluster-ops"
dev_namespace: &dev "labs-dev"
test_namespace: &test "labs-test"
staging_namespace: &stage "labs-staging"

# App of applications list
applications:
  # Bootstrap Project
  - name: bootstrap
    enabled: true
    source: https://redhat-cop.github.io/helm-charts
    chart_name: bootstrap-project
    source_ref: "1.0.2"
    values:
      bindings: &binds # this labs-devs is the GROUP NAME in IDM
        - name: labs-devs
          kind: Group
          role: edit
        # this labs-admins is the GROUP NAME in IDM
        - name: labs-admins
          kind: Group
          role: admin
      namespaces:
        - name: *ci_cd
          bindings: *binds
          operatorgroup: false
        - name: *dev
          bindings: *binds
          operatorgroup: true
        - name: *test
          bindings: *binds
          operatorgroup: true
        - name: *stage
          bindings: *binds
          operatorgroup: true

   # Hoverfly
  - name: hoverfly
    enabled: true
    source: https://github.com/helm/charts.git
    source_path: incubator/hoverfly
    source_ref: "master"
    values:
      image:
        tag: v1.3.3
      openshift:
        route:
          admin:
            enabled: true
            hostname: ''
          proxy:
            enabled: true
            hostname: ''

# Tekton Pipelines
  - name: tekton-pipeline
    enabled: true
    source: https://github.com/rht-labs/tech-exercise.git
    source_ref: main
    source_path: tekton
    values:
      team: my-team

