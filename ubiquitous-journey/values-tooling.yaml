# App of applications list
applications:
   # Hoverfly
  - name: hoverfly
    enabled: true
    source: https://github.com/helm/charts.git
    source_path: incubator/hoverfly
    source_ref: "master"
    values:
      image:
        tag: v1.3.3
      openshift:
        route:
          admin:
            enabled: true
            hostname: ''
          proxy:
            enabled: true
            hostname: ''

# Tekton Pipelines
  - name: tekton-pipeline
    enabled: true
    source: https://github.com/rht-labs/tech-exercise.git
    source_ref: main
    source_path: tekton
    values:
      team: my-team

